<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="35%" stop-color="#081426" />
      <stop offset="70%" stop-color="#0c1a30" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="25%" stop-color="#1F6FEB" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="75%" stop-color="#238636" />
      <stop offset="100%" stop-color="#844FBA" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121d30" />
      <stop offset="100%" stop-color="#0a1220" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#79C0FF" />
      <stop offset="100%" stop-color="#56D364" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="0" y="0" width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Outer Glowing Border -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.07" stroke="#58A6FF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="640" y1="0" x2="640" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="1120" y1="0" x2="1120" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Left Accent Terminal Icon Box -->
  <g transform="translate(60, 42)">
    <rect width="64" height="64" rx="14" fill="#0D192E" stroke="#1F6FEB" stroke-width="1.5" />
    <path d="M22 24L30 32L22 40" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="34" y1="40" x2="44" y2="40" stroke="#56D364" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Header Text Section (Pure Inline Attributes - No CSS Class Dependency) -->
  <text x="144" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="42px" font-weight="800" letter-spacing="-0.5px">Vishwjeet Kumar Mehta</text>
  <text x="144" y="104" fill="url(#text-accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20px" font-weight="600" letter-spacing="0.2px">Senior DevOps &amp; DevSecOps Consultant &bull; Cloud Architect</text>

  <!-- Company Pill Badge -->
  <g transform="translate(144, 122)">
    <rect width="400" height="34" rx="17" fill="#0F2038" stroke="#388BFD" stroke-width="1.2" />
    <!-- Office Building Icon -->
    <path d="M16 11H26V23H16V11Z" fill="#58A6FF" opacity="0.9" />
    <rect x="18" y="14" width="2" height="2" fill="#FFFFFF" />
    <rect x="22" y="14" width="2" height="2" fill="#FFFFFF" />
    <rect x="18" y="18" width="2" height="2" fill="#FFFFFF" />
    <rect x="22" y="18" width="2" height="2" fill="#FFFFFF" />
    <text x="34" y="22" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14px" font-weight="600">Shiksha Samadhan Pvt. Ltd.</text>
    <circle cx="280" cy="17" r="4" fill="#3FB950" />
    <text x="292" y="22" fill="#3FB950" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11px" font-weight="700">CURRENT ROLE</text>
  </g>

  <!-- Highlight Stat Cards Row (Width 1200 - 4 Cards evenly spaced) -->
  <g transform="translate(60, 180)">
    <!-- Stat 1: Total Experience -->
    <g transform="translate(0, 0)">
      <rect width="250" height="82" rx="12" fill="url(#card-grad)" stroke="#30363D" stroke-width="1.2" />
      <text x="20" y="28" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700" letter-spacing="0.5px">TOTAL IT EXPERIENCE</text>
      <text x="20" y="56" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22px" font-weight="800">10+ Years</text>
      <text x="20" y="72" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="600">Enterprise Infrastructure Scale</text>
      <circle cx="225" cy="41" r="15" fill="#0078D4" opacity="0.3" />
      <text x="219" y="47" font-size="14px" fill="#58A6FF">&#x26A1;</text>
    </g>

    <!-- Stat 2: DevOps Specialization -->
    <g transform="translate(275, 0)">
      <rect width="250" height="82" rx="12" fill="url(#card-grad)" stroke="#30363D" stroke-width="1.2" />
      <text x="20" y="28" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700" letter-spacing="0.5px">DEVOPS &amp; DEVSECOPS</text>
      <text x="20" y="56" fill="#56D364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22px" font-weight="800">8+ Years</text>
      <text x="20" y="72" fill="#56D364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="600">CI/CD &amp; Shift-Left Security</text>
      <circle cx="225" cy="41" r="15" fill="#238636" opacity="0.3" />
      <text x="219" y="47" font-size="14px" fill="#56D364">&#x1F6E1;</text>
    </g>

    <!-- Stat 3: Migration Scale -->
    <g transform="translate(550, 0)">
      <rect width="250" height="82" rx="12" fill="url(#card-grad)" stroke="#30363D" stroke-width="1.2" />
      <text x="20" y="28" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700" letter-spacing="0.5px">ENTERPRISE MIGRATION</text>
      <text x="20" y="56" fill="#79C0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22px" font-weight="800">100+ Workloads</text>
      <text x="20" y="72" fill="#79C0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="600">Zero Unplanned Downtime</text>
      <circle cx="225" cy="41" r="15" fill="#1F6FEB" opacity="0.3" />
      <text x="219" y="47" font-size="14px" fill="#79C0FF">&#x1F680;</text>
    </g>

    <!-- Stat 4: Cost & FinOps -->
    <g transform="translate(825, 0)">
      <rect width="255" height="82" rx="12" fill="url(#card-grad)" stroke="#30363D" stroke-width="1.2" />
      <text x="20" y="28" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="700" letter-spacing="0.5px">FINOPS COST OPTIMIZATION</text>
      <text x="20" y="56" fill="#E3B341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22px" font-weight="800">28% Avg Savings</text>
      <text x="20" y="72" fill="#E3B341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="600">Rightsizing &amp; RI Economics</text>
      <circle cx="230" cy="41" r="15" fill="#D29922" opacity="0.3" />
      <text x="224" y="47" font-size="14px" fill="#E3B341">&#x1F4B0;</text>
    </g>
  </g>

  <!-- Bottom Core Competencies Tagline -->
  <g transform="translate(60, 310)">
    <text x="0" y="0" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12px" font-weight="600">
      CORE ARCHITECTURAL PILLARS: <tspan fill="#58A6FF">Microsoft CAF Landing Zones</tspan> &bull; <tspan fill="#79C0FF">Multi-Region Terraform IaC</tspan> &bull; <tspan fill="#56D364">Shift-Left DevSecOps</tspan> &bull; <tspan fill="#D2A8FF">Hardened AKS Kubernetes</tspan> &bull; <tspan fill="#FFA657">FinOps &amp; 99.99% SRE Resilience</tspan>
    </text>
  </g>
</svg>
